name: OnlyMarket CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: onlymarket
          POSTGRES_PASSWORD: test
          POSTGRES_DB: onlymarket
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://onlymarket:test@localhost:5432/onlymarket
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run db:validate
      - run: npm run db:deploy
      - run: npx prisma generate
      - run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm test
        env:
          RUN_DB_TESTS: '1'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser acceptance smoke
        env:
          BOOTSTRAP_EMAIL: browser-smoke@example.invalid
          BOOTSTRAP_SLUG: browser-smoke
          BOOTSTRAP_NAME: Browser Smoke
          BOOTSTRAP_PASSWORD: CI-only-test-password-2026
          PLATFORM_ADMIN_ENABLED: 'true'
          PLATFORM_BOOTSTRAP_EMAIL: platform-smoke@example.invalid
          PLATFORM_BOOTSTRAP_PASSWORD: CI-only-platform-test-password
          HUB_INTEGRATION_TOKEN: CI-only-hub-test-token-not-production-12345
        run: |
          node scripts/bootstrap.mjs
          node scripts/bootstrap-platform.mjs
          npm run start -- --hostname localhost > /tmp/onlymarket-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          npm run test:browser || { cat /tmp/onlymarket-next.log; exit 1; }
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated compose stack
        run: |
          umask 077
          printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 32)" > .env
          docker network create proxy
          docker compose config -q
          docker compose up -d --wait db
          docker compose build app
          docker compose run --rm app npm run db:deploy
          docker compose up -d --wait app
          docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(console.log)"
      - name: Backup and isolated restore
        run: |
          docker compose exec -T db psql -U onlymarket -d onlymarket -v ON_ERROR_STOP=1 -c 'INSERT INTO "Tenant" ("id","name","slug") VALUES ('"'"'ci-restore'"'"','"'"'CI restore'"'"','"'"'ci-restore'"'"');'
          dump="$(sh scripts/backup.sh /tmp/onlymarket-ci-backups)"
          docker compose exec -T db createdb -U onlymarket onlymarket_restore
          docker compose exec -T db pg_restore -U onlymarket -d onlymarket_restore --exit-on-error < "$dump"
          test "$(docker compose exec -T db psql -U onlymarket -d onlymarket_restore -Atc 'SELECT count(*) FROM "Tenant" WHERE "id" = '"'"'ci-restore'"'"';')" = 1
      - name: Diagnostics and disposable CI cleanup
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --tail=80 app || true
          docker compose down -v || true
          docker network rm proxy || true
