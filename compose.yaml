name: onlymarket
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: onlymarket
      POSTGRES_USER: onlymarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - onlymarket_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlymarket -d onlymarket"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    build: .
    container_name: onlymarket-web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://onlymarket:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/onlymarket
      TZ: America/Argentina/Buenos_Aires
      PLATFORM_ADMIN_ENABLED: ${PLATFORM_ADMIN_ENABLED:-false}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-onlymarket.nanoapps.ar}
      TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-nanoapps.ar}
      TENANT_URL_SCHEME: ${TENANT_URL_SCHEME:-}
      TENANT_URL_PORT: ${TENANT_URL_PORT:-}
      NANOAPPS_ROUTER_URL: ${NANOAPPS_ROUTER_URL-http://nanoapps-router:8080}
      EXTERNAL_SAAS_ASK_URLS: ${EXTERNAL_SAAS_ASK_URLS:-}
      TENANT_NAMESPACE_MODE: ${TENANT_NAMESPACE_MODE:-shared}
      RESERVED_SLUGS: ${RESERVED_SLUGS:-}
      HUB_INTEGRATION_ENABLED: ${HUB_INTEGRATION_ENABLED:-true}
      HUB_INTEGRATION_TOKEN: ${HUB_INTEGRATION_TOKEN:-}
      HUB_MANAGEMENT_ENABLED: ${HUB_MANAGEMENT_ENABLED:-false}
      HUB_MANAGEMENT_TOKEN: ${HUB_MANAGEMENT_TOKEN:-}
      HUB_MANAGEMENT_OPERATIONS: ${HUB_MANAGEMENT_OPERATIONS:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [private, proxy]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  onlymarket_data:
networks:
  private:
    internal: true
  proxy:
    external: true
    name: proxy
